<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oye My Puchuu, My Rasmalai, Meri Jannuuuu ❤️</title>

<!-- Google Noto Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Noto Serif Display', serif;
}

body{
  overflow:hidden;
  height:100vh;
  position:relative;
  color:white;
}

/* ---------------- FIRST SCREEN ---------------- */

.first-screen{
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(135deg,#ff9a9e,#ff66cc,#ff1493);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:3;
  transition:1s;
  padding:20px;
  text-align:center;
}

.first-screen h1{
  font-size:clamp(20px,5vw,32px);
  margin-bottom:20px;
  text-shadow:0 0 20px #fff;
  animation:fadeInText 2s ease-in-out forwards;
}

@keyframes fadeInText{
  0%{opacity:0; transform:translateY(-10px);}
  100%{opacity:1; transform:translateY(0);}
}

button{
  padding:12px 28px;
  border:none;
  border-radius:30px;
  background:white;
  color:#ff1493;
  font-weight:bold;
  cursor:pointer;
  font-size:clamp(14px,4vw,18px);
  box-shadow:0 0 20px white;
  transition:0.3s;
}
button:hover{
  transform:scale(1.1);
}

/* Neon Glow Heart */
.heart-bg{
  position:absolute;
  width:80vw;
  max-width:450px;
  height:80vw;
  max-height:450px;
  stroke:#ff4da6;
  stroke-width:4;
  fill:none;
  opacity:0.6;
  filter:url(#glow);
  animation:pulseGlow 2s ease-in-out infinite alternate;
  z-index:1;
}

.heart-bg path{
  stroke-dasharray:2000;
  stroke-dashoffset:2000;
  animation:drawHeart 4s linear infinite;
}

@keyframes drawHeart{
  0%{ stroke-dashoffset:2000; }
  100%{ stroke-dashoffset:0; }
}

@keyframes pulseGlow{
  from{opacity:0.5; transform:scale(1);}
  to{opacity:1; transform:scale(1.05);}
}

/* ---------------- SECOND SCREEN ---------------- */

.second-screen{
  position:absolute;
  width:100%;
  height:100%;
  background:radial-gradient(circle at top,#14001f,#000);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  filter:blur(10px);
  transition:1s;
  overflow:hidden;
  padding:20px;
  text-align:center;
}

/* Card */
.card{
  width:95%;
  max-width:450px;
  padding:25px;
  border-radius:25px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);
  text-align:center;
  box-shadow:0 0 40px rgba(255,20,147,0.6);
  z-index:2;
  position:relative;
}

.card h1{
  font-size:clamp(20px,5vw,28px);
  color:#ff66cc;
  margin-bottom:10px;
  animation:fadeInText 2s ease-in-out forwards;
}

.card p{
  font-size:clamp(14px,4vw,16px);
  margin:8px 0;
  line-height:1.5;
}

/* Typewriter Text */
#typeText{
  font-size:clamp(14px,4vw,16px);
  margin-top:10px;
  max-height:250px;
  overflow:auto;
  text-align:left;
  white-space:pre-wrap;
  line-height:1.6;
  animation:fadeInText 1.5s ease-in-out forwards;
  scroll-behavior: smooth;
}

/* Propose Button */
.propose-btn{
  margin-top:15px;
  display:none;
  background:linear-gradient(45deg,#ffd700,#ff1493);
  color:white;
  box-shadow:0 0 20px gold;
  padding:10px 25px;
  border:none;
  border-radius:25px;
  font-size:clamp(14px,4vw,16px);
  cursor:pointer;
  transition:0.3s;
}
.propose-btn:hover{transform:scale(1.1);}

/* Stars */
.star{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  animation:twinkle 1.5s infinite ease-in-out;
  z-index:1;
}
@keyframes twinkle{
  0%{opacity:0.2; transform:scale(1);}
  50%{opacity:1; transform:scale(1.8);}
  100%{opacity:0.2; transform:scale(1);}
}

/* Fireworks - top layer */
.rocket{
  position:absolute;
  bottom:0;
  width:4px;
  height:15px;
  background:white;
  animation:rocketUp 1s linear forwards;
  z-index:999;
}
@keyframes rocketUp{
  0%{transform:translateY(0);}
  100%{transform:translateY(-80vh);}
}

/* Particle */
.particle{
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  animation:burst 1.2s ease-out forwards;
  z-index:999;
}
@keyframes burst{
  0%{opacity:1; transform:translate(0,0) scale(1);}
  100%{opacity:0; transform:translate(var(--x), var(--y)) scale(0.5);}
}

/* Ring */
.ring{
  font-size:clamp(30px,6vw,50px);
  animation:ringPop 1s ease-in-out infinite alternate;
}
@keyframes ringPop{
  from{transform:scale(1);}
  to{transform:scale(1.2);}
}

/* Animated Hearts on 2nd screen */
.animated-heart{
  position:absolute;
  font-size:clamp(20px,5vw,40px);
  animation:heartFloat 4s ease-in-out infinite;
  opacity:0.7;
  z-index:1;
}

@keyframes heartFloat{
  0%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-40px) scale(1.1);}
  100%{transform:translateY(0) scale(1);}
}

/* Responsive adjustments */
@media(max-width:480px){
  .card{
    padding:20px;
  }
  .first-screen h1, .card h1{
    font-size:clamp(18px,6vw,24px);
  }
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="dhun.mp3" type="audio/mpeg">
</audio>

<!-- FIRST SCREEN -->
<div class="first-screen" id="first">

<svg class="heart-bg" viewBox="0 0 600 600">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M300 540 
           L90 330 
           A120 120 0 1 1 300 210 
           A120 120 0 1 1 510 330 
           Z"/>
</svg>

  <h1>Wish You A Happy First Anniversary My Kaju Katli 😋💖</h1>
  <button onclick="enterLove()">Click Here Betu 😘</button>
</div>

<!-- SECOND SCREEN -->
<div class="second-screen" id="second">
  <div class="card">
    <h1>Wish You A Happy First Anniversary My Kaju Katli 😋💖🌙</h1>
    <p>17 February 2025 to 7 Janam ♾️🧿</p>
    <p id="typeText"></p>
    <button class="propose-btn" id="proposeBtn" onclick="showRing()">CHIRKUT 💍</button>
    <div id="ringArea"></div>
  </div>
</div>

<script>
/* Stars */
function createStars(){
  for(let i=0;i<150;i++){
    let star=document.createElement("div");
    star.className="star";
    star.style.top=Math.random()*100+"vh";
    star.style.left=Math.random()*100+"vw";
    star.style.animationDuration=(Math.random()*2+1)+"s";
    document.getElementById("second").appendChild(star);
  }
}
createStars();

/* Animated hearts on 2nd screen */
function createHearts(){
  const second=document.getElementById("second");
  for(let i=0;i<20;i++){
    let heart=document.createElement("div");
    heart.className="animated-heart";
    heart.innerText="💖";
    heart.style.left=Math.random()*90+"vw";
    heart.style.animationDuration=(3+Math.random()*2)+"s";
    heart.style.fontSize=(20+Math.random()*20)+"px";
    second.appendChild(heart);
  }
}
createHearts();

/* Enter */
function enterLove(){
  document.getElementById("first").style.opacity="0";
  document.getElementById("first").style.pointerEvents="none";
  document.getElementById("second").style.filter="blur(0)";
  let music=document.getElementById("music");
  if(music){ music.play().catch(()=>{}); }
  typeWriter();
}

/* Typewriter */
let msg= `Happy Anniversary My Jannu Bby, My Sweetu, My Puchuu Bby, My wife , Sharmila Ji ,Dharampatni Ji ,Pretiest Girl on Earth 🌏 ,My Betu ,My Bby, My soulmate,Meri Pasndida aurat ,My forever Angry Bird ! 🐦 🫂
Today is the most special day because it brought Us together this world—the girl who means the world to me 🌍🧿. Since 9th February, my life has taken a magical turn, and from the moment we got committed on 17th February at 11:22 PM 💓, I knew deep in my heart that this is something real, something forever ♾️. Every moment with you feels like home, and I can’t wait for the day when I’ll get to call you mine officially, not just by love, but by the bond of marriage 💍. Until then, I promise to keep loving you, annoying you, pampering you, and being your biggest supporter 🫂. My Heartbeat, my love—your smile is my favorite sight, and your happiness is my mission. Here's to us—to forever.♾️ 🫂🫠
Every night, when we end the day with our video calls 📱🫶, hearing your voice and seeing your sleepy smile 🥱😘, it’s like my whole world slows down and everything feels right. You are my puchudaaaa💋💋.I dream of the day when I won’t need a screen to see you 👀, when we’ll be together under the same roof 🏡, sharing both good days and bad, not just as lovers—but as Husband And Wife💍💌🧿.  
You’re not just my love, you’re my future✨. Happy Anniversary, my love—thank you for being my everything 🎂😘🫂💋💋💋   `;
let i=0;

function typeWriter(){
  const typeText=document.getElementById("typeText");
  if(i<msg.length){
    typeText.innerHTML+=msg.charAt(i);
    i++;
    typeText.scrollTop = typeText.scrollHeight; // auto scroll
    setTimeout(typeWriter,50); // faster typing for smoother experience
  } else {
    launchFireworks();
    document.getElementById("proposeBtn").style.display="inline-block";
  }
}

/* Fireworks */
function launchFireworks(){
  for(let r=0;r<8;r++){
    setTimeout(()=>{
      let rocket=document.createElement("div");
      rocket.className="rocket";
      let startX=Math.random()*100;
      rocket.style.left=startX+"vw";
      document.body.appendChild(rocket);

      rocket.addEventListener("animationend",function(){
        explode(startX);
        rocket.remove();
      });

    },r*200);
  }
}

function explode(xPos){
  const colors=["#ff0000","#ff1493","#00ffff","#ffff00","#00ff00","#ff4500","#8a2be2"];
  for(let i=0;i<60;i++){
    let particle=document.createElement("div");
    particle.className="particle";
    particle.style.left=xPos+"vw";
    particle.style.top="20vh";
    particle.style.background=colors[Math.floor(Math.random()*colors.length)];
    let angle=Math.random()*2*Math.PI;
    let distance=Math.random()*250;
    particle.style.setProperty("--x",Math.cos(angle)*distance+"px");
    particle.style.setProperty("--y",Math.sin(angle)*distance+"px");
    document.body.appendChild(particle);
    setTimeout(()=>particle.remove(),1200);
  }
}

/* Ring */
function showRing(){
  document.getElementById("ringArea").innerHTML="<div class='ring'>💍</div><p>I Love You Soo Much My Chotu Don 🤏❤️</p>";
}
</script>

</body>
</html>
